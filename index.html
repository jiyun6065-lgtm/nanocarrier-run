<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>NanoCarrier Run - 세포막 DDS 투과 시뮬레이터</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
        }

        #game-container {
            width: 600px;
            max-width: 90vw;
            height: 200px;
            border-bottom: 4px solid #38bdf8;
            position: relative;
            background-color: #1e293b;
            overflow: hidden;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
        }

        #carrier {
            width: 45px;
            height: 45px;
            position: absolute;
            bottom: 0px;
            left: 50px;
        }

        .jump {
            animation: jump-animation 0.6s ease-out;
        }

        @keyframes jump-animation {
            0% { bottom: 0px; }
            50% { bottom: 100px; }
            100% { bottom: 0px; }
        }

        #obstacle {
            width: 25px;
            height: 35px;
            position: absolute;
            bottom: 0px;
            right: -30px;
            background-color: #ef4444;
            border-radius: 4px;
        }

        .obstacle-move {
            animation: move-obstacle 2s infinite linear;
        }

        @keyframes move-obstacle {
            0% { right: -30px; }
            100% { right: 630px; }
        }

        .hud {
            width: 600px;
            max-width: 90vw;
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-weight: bold;
        }

        .instruction {
            margin-top: 10px;
            color: #94a3b8;
            text-align: center;
        }

        #game-over-text {
            display: none;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ef4444;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }
    </style>
</head>
<body>

    <h1>NanoCarrier Run</h1>

    <div id="game-container">
        <div id="carrier">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="42" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="8,4"/>
                <circle cx="50" cy="50" r="30" fill="#818cf8"/>
                <circle cx="50" cy="50" r="18" fill="#c084fc"/>
                <circle cx="42" cy="45" r="4" fill="#ffffff"/>
                <circle cx="58" cy="45" r="4" fill="#ffffff"/>
            </svg>
        </div>

        <div id="obstacle" class="obstacle-move"></div>
        <div id="game-over-text">세포 내 분해 완료 (GAME OVER)<br><span style="font-size:14px; color:#fff;">클릭 시 재시작</span></div>
    </div>

    <div class="hud">
        <div>지질막 내구도: <span id="hp" style="color: #4ade80;">100%</span></div>
        <div>투과 도달 거리: <span id="score">0</span>m</div>
    </div>

    <p class="instruction">스페이스바 또는 화면을 클릭하여 점프하세요!</p>

    <script>
        const carrier = document.getElementById("carrier");
        const obstacle = document.getElementById("obstacle");
        const hpDisplay = document.getElementById("hp");
        const scoreDisplay = document.getElementById("score");
        const gameOverText = document.getElementById("game-over-text");

        let hp = 100;
        let score = 0;
        let isGameOver = false;
        let isInvincible = false; // 연속 피격 방지 무적 플래그

        // 점프 제어
        function jump() {
            if (isGameOver) {
                restartGame();
                return;
            }
            if (!carrier.classList.contains("jump")) {
                carrier.classList.add("jump");
                setTimeout(() => carrier.classList.remove("jump"), 600);
            }
        }

        document.addEventListener("keydown", (e) => { if (e.code === "Space") jump(); });
        document.addEventListener("touchstart", () => jump());
        document.addEventListener("mousedown", () => jump());

        // 점수증가 타이머
        const scoreInterval = setInterval(() => {
            if (!isGameOver) {
                score += 1;
                scoreDisplay.innerText = score;
            }
        }, 100);

        // 충돌 감지 루프 (10ms 마다)
        const checkCollision = setInterval(() => {
            if (isGameOver) return;

            const carrierRect = carrier.getBoundingClientRect();
            const obstacleRect = obstacle.getBoundingClientRect();

            // 위치 겹침 판정
            const isColliding = !(
                carrierRect.right < obstacleRect.left ||
                carrierRect.left > obstacleRect.right ||
                carrierRect.bottom < obstacleRect.top ||
                carrierRect.top > obstacleRect.bottom
            );

            if (isColliding && !isInvincible) {
                hp -= 25; // 피격 시 25% 감축
                if (hp < 0) hp = 0;
                hpDisplay.innerText = hp + "%";

                if (hp <= 30) hpDisplay.style.color = "#ef4444";

                if (hp <= 0) {
                    endGame();
                } else {
                    // 피격 후 0.5초간 쿨타임
                    isInvincible = true;
                    carrier.style.opacity = "0.5";
                    setTimeout(() => {
                        isInvincible = false;
                        carrier.style.opacity = "1";
                    }, 500);
                }
            }
        }, 10);

        function endGame() {
            isGameOver = true;
            obstacle.classList.remove("obstacle-move");
            gameOverText.style.display = "block";
        }

        function restartGame() {
            hp = 100;
            score = 0;
            isGameOver = false;
            hpDisplay.innerText = "100%";
            hpDisplay.style.color = "#4ade80";
            scoreDisplay.innerText = "0";
            gameOverText.style.display = "none";
            obstacle.classList.add("obstacle-move");
        }
    </script>
</body>
</html>
