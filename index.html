<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>NanoCarrier Run - 세포막 DDS 투과 시뮬레이터</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* 게임 스테이지 */
        #game-container {
            width: 600px;
            height: 200px;
            border-bottom: 4px solid #38bdf8;
            position: relative;
            background-color: #1e293b;
            overflow: hidden;
            border-radius: 8px 8px 0 0;
        }

        /* 나노캐리어 (주인공) */
        #carrier {
            width: 45px;
            height: 45px;
            position: absolute;
            bottom: 0px;
            left: 50px;
        }

        /* 점프 애니메이션 클래스 */
        .jump {
            animation: jump-animation 0.6s ease-out;
        }

        @keyframes jump-animation {
            0% { bottom: 0px; }
            50% { bottom: 100px; }
            100% { bottom: 0px; }
        }

        /* 장애물 (산성 파도 H+) */
        #obstacle {
            width: 25px;
            height: 35px;
            position: absolute;
            bottom: 0px;
            right: -30px;
            background-color: #ef4444;
            border-radius: 4px;
            animation: move-obstacle 2s infinite linear;
        }

        @keyframes move-obstacle {
            0% { right: -30px; }
            100% { right: 630px; }
        }

        /* 상태 표시줄 */
        .hud {
            width: 600px;
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-weight: bold;
        }

        .instruction {
            margin-top: 10px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <h1>NanoCarrier Run</h1>

    <div id="game-container">
        <!-- 주인공: 나노캐리어 SVG -->
        <div id="carrier">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="42" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="8,4"/>
                <circle cx="50" cy="50" r="30" fill="#818cf8"/>
                <circle cx="50" cy="50" r="18" fill="#c084fc"/>
                <circle cx="42" cy="45" r="4" fill="#ffffff"/>
                <circle cx="58" cy="45" r="4" fill="#ffffff"/>
            </svg>
        </div>

        <!-- 장애물: 산성 파도(H+) -->
        <div id="obstacle"></div>
    </div>

    <div class="hud">
        <div>지질막 내구도: <span id="hp" style="color: #4ade80;">100%</span></div>
        <div>투과 도달 거리: <span id="score">0</span>m</div>
    </div>

    <p class="instruction">스페이스바(Space)를 눌러 산성 파도를 피하세요!</p>

    <script>
        const carrier = document.getElementById("carrier");

        // 스페이스바 누르면 점프
        document.addEventListener("keydown", function(event) {
            if (event.code === "Space") {
                jump();
            }
        });

        function jump() {
            if (!carrier.classList.contains("jump")) {
                carrier.classList.add("jump");
                setTimeout(function() {
                    carrier.classList.remove("jump");
                }, 600); // 점프 애니메이션 시간(0.6초)
            }
        }
    </script>
</body>
</html>
