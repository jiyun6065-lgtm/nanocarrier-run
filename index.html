<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoCarrier Run - 세포막 DDS 투과 시뮬레이터</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 28px;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        /* 메인 시작 화면 스타일 */
        #start-screen {
            width: 600px;
            max-width: 90vw;
            background-color: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        .character-selection {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            margin-bottom: 20px;
        }

        .char-card {
            flex: 1;
            background-color: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .char-card:hover {
            border-color: #38bdf8;
            transform: translateY(-4px);
        }

        .char-card.selected {
            border-color: #38bdf8;
            background-color: rgba(56, 189, 248, 0.15);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .char-preview {
            width: 50px;
            height: 50px;
            margin-bottom: 10px;
        }

        .char-name {
            font-size: 14px;
            font-weight: bold;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        .char-desc {
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
            line-height: 1.3;
        }

        .btn-start {
            background-color: #38bdf8;
            color: #0f172a;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 36px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .btn-start:hover {
            background-color: #7dd3fc;
            transform: scale(1.05);
        }

        /* 게임 화면 컨테이너 */
        #game-area {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        #game-container {
            width: 600px;
            max-width: 90vw;
            height: 200px;
            border-bottom: 4px solid #38bdf8;
            position: relative;
            background-color: #1e293b;
            overflow: hidden;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
        }

        /* 오른쪽 상단 일시정지 버튼 */
        #pause-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 30;
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid #38bdf8;
            color: #ffffff;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }

        #pause-btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }

        #carrier {
            width: 45px;
            height: 45px;
            position: absolute;
            bottom: 0px;
            left: 50px;
            z-index: 10;
        }

        .jump {
            animation: jump-animation 0.6s ease-out;
        }

        @keyframes jump-animation {
            0% { bottom: 0px; }
            50% { bottom: 100px; }
            100% { bottom: 0px; }
        }

        #obstacle {
            width: 25px;
            height: 35px;
            position: absolute;
            bottom: 0px;
            right: -30px;
            background-color: #ef4444;
            border-radius: 4px;
        }

        #item {
            width: 20px;
            height: 20px;
            position: absolute;
            bottom: 70px;
            right: -30px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 8px #38bdf8;
        }

        .object-move {
            animation: move-object 2s infinite linear;
        }

        @keyframes move-object {
            0% { right: -30px; }
            100% { right: 630px; }
        }

        /* 애니메이션 일시정지용 클래스 */
        .paused {
            animation-play-state: paused !important;
        }

        .hud {
            width: 600px;
            max-width: 90vw;
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-weight: bold;
        }

        .instruction {
            margin-top: 10px;
            color: #94a3b8;
            text-align: center;
            font-size: 14px;
        }

        #message-text {
            display: none;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 4px #000;
            z-index: 20;
        }
    </style>
</head>
<body>

    <h1>NanoCarrier Run</h1>

    <!-- 시작 및 캐릭터 선택 화면 -->
    <div id="start-screen">
        <div class="subtitle">세포막 DDS 투과 시뮬레이터 - 캐리어를 선택하세요</div>
        
        <div class="character-selection">
            <!-- 1. 표준형 -->
            <div class="char-card selected" onclick="selectCharacter('standard')" id="card-standard">
                <div class="char-preview">
                    <svg viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="42" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="8,4"/>
                        <circle cx="50" cy="50" r="30" fill="#818cf8"/>
                        <circle cx="50" cy="50" r="18" fill="#c084fc"/>
                        <circle cx="42" cy="45" r="4" fill="#ffffff"/>
                        <circle cx="58" cy="45" r="4" fill="#ffffff"/>
                    </svg>
                </div>
                <div class="char-name">표준형 (Type 1)</div>
                <div class="char-desc">기본 나노캐리어 모델<br>균형 잡힌 성능</div>
            </div>

            <!-- 2. 고밀도형 -->
            <div class="char-card" onclick="selectCharacter('high-density')" id="card-high-density">
                <div class="char-preview">
                    <svg viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="44" fill="none" stroke="#f59e0b" stroke-width="10"/>
                        <circle cx="50" cy="50" r="32" fill="#10b981"/>
                        <circle cx="50" cy="50" r="18" fill="#047857"/>
                        <circle cx="42" cy="45" r="4" fill="#ffffff"/>
                        <circle cx="58" cy="45" r="4" fill="#ffffff"/>
                    </svg>
                </div>
                <div class="char-name">고밀도형 (Type 2)</div>
                <div class="char-desc">강화된 이중 지질막<br>높은 안정성</div>
            </div>

            <!-- 3. 표적지향형 -->
            <div class="char-card" onclick="selectCharacter('targeted')" id="card-targeted">
                <div class="char-preview">
                    <svg viewBox="0 0 100 100">
                        <!-- 리간드 突起 표현 -->
                        <path d="M 50,2 L 50,15 M 98,50 L 85,50 M 50,98 L 50,85 M 2,50 L 15,50" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
                        <circle cx="50" cy="50" r="34" fill="#f43f5e"/>
                        <circle cx="50" cy="50" r="20" fill="#fb7185"/>
                        <circle cx="42" cy="45" r="4" fill="#ffffff"/>
                        <circle cx="58" cy="45" r="4" fill="#ffffff"/>
                    </svg>
                </div>
                <div class="char-name">표적지향형 (Type 3)</div>
                <div class="char-desc">리간드 부착 특화형<br>표적 수용체 결합 특화</div>
            </div>
        </div>

        <button class="btn-start" onclick="startGame()">게임 시작하기</button>
    </div>

    <!-- 게임 플레이 영역 -->
    <div id="game-area">
        <div id="game-container">
            <!-- 일시정지 버튼 -->
            <button id="pause-btn">⏸️ 일시정지</button>

            <!-- 주인공 캐릭터 -->
            <div id="carrier"></div>

            <!-- 장애물 및 아이템 -->
            <div id="obstacle"></div>
            <div id="item" style="animation-delay: 1s;"></div>

            <!-- 게임 상태 메세지 -->
            <div id="message-text"></div>
        </div>

        <div class="hud">
            <div>지질막 내구도: <span id="hp" style="color: #4ade80;">100%</span></div>
            <div>표적 수용체 거리: <span id="score">0</span> / 300m</div>
        </div>

        <p class="instruction">스페이스바/터치로 점프! (일시정지: 우측 상단 버튼 또는 P키)</p>
    </div>

    <script>
        // 캐릭터 SVG 템플릿
        const characterSVGs = {
            'standard': `
                <svg viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="42" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="8,4"/>
                    <circle cx="50" cy="50" r="30" fill="#818cf8"/>
                    <circle cx="50" cy="50" r="18" fill="#c084fc"/>
                    <circle cx="42" cy="45" r="4" fill="#ffffff"/>
                    <circle cx="58" cy="45" r="4" fill="#ffffff"/>
                </svg>`,
            'high-density': `
                <svg viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="44" fill="none" stroke="#f59e0b" stroke-width="10"/>
                    <circle cx="50" cy="50" r="32" fill="#10b981"/>
                    <circle cx="50" cy="50" r="18" fill="#047857"/>
                    <circle cx="42" cy="45" r="4" fill="#ffffff"/>
                    <circle cx="58" cy="45" r="4" fill="#ffffff"/>
                </svg>`,
            'targeted': `
                <svg viewBox="0 0 100 100">
                    <path d="M 50,2 L 50,15 M 98,50 L 85,50 M 50,98 L 50,85 M 2,50 L 15,50" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
                    <circle cx="50" cy="50" r="34" fill="#f43f5e"/>
                    <circle cx="50" cy="50" r="20" fill="#fb7185"/>
                    <circle cx="42" cy="45" r="4" fill="#ffffff"/>
                    <circle cx="58" cy="45" r="4" fill="#ffffff"/>
                </svg>`
        };

        const startScreen = document.getElementById("start-screen");
        const gameArea = document.getElementById("game-area");
        const carrier = document.getElementById("carrier");
        const obstacle = document.getElementById("obstacle");
        const item = document.getElementById("item");
        const hpDisplay = document.getElementById("hp");
        const scoreDisplay = document.getElementById("score");
        const messageText = document.getElementById("message-text");
        const pauseBtn = document.getElementById("pause-btn");

        let selectedType = 'standard';
        let hp = 100;
        let score = 0;
        const targetDistance = 300;
        let isGameStarted = false;
        let isGameOver = false;
        let isPaused = false;
        let isInvincible = false;

        // 캐릭터 선택
        function selectCharacter(type) {
            selectedType = type;
            document.querySelectorAll('.char-card').forEach(card => card.classList.remove('selected'));
            document.getElementById(`card-${type}`).classList.add('selected');
        }

        // 게임 시작하기
        function startGame() {
            carrier.innerHTML = characterSVGs[selectedType];
            startScreen.style.display = "none";
            gameArea.style.display = "flex";
            isGameStarted = true;
            restartGame();
        }

        // 일시정지 토글 기능
        function togglePause(e) {
            if (e) e.stopPropagation(); // 점프 이벤트 방지
            if (!isGameStarted || isGameOver) return;

            isPaused = !isPaused;

            if (isPaused) {
                obstacle.classList.add("paused");
                item.classList.add("paused");
                carrier.classList.add("paused");
                pauseBtn.innerText = "▶️ 다시 시작";
                messageText.innerHTML = "<span style='color:#38bdf8;'>일시정지됨</span>";
                messageText.style.display = "block";
            } else {
                obstacle.classList.remove("paused");
                item.classList.remove("paused");
                carrier.classList.remove("paused");
                pauseBtn.innerText = "⏸️ 일시정지";
                messageText.style.display = "none";
            }
        }

        pauseBtn.addEventListener("click", togglePause);
        pauseBtn.addEventListener("touchstart", (e) => {
            e.stopPropagation();
            togglePause(e);
        });

        function jump() {
            if (!isGameStarted) return;
            if (isGameOver) {
                restartGame();
                return;
            }
            if (isPaused) return;

            if (!carrier.classList.contains("jump")) {
                carrier.classList.add("jump");
                setTimeout(() => carrier.classList.remove("jump"), 600);
            }
        }

        document.addEventListener("keydown", (e) => {
            if (e.code === "Space") jump();
            if (e.code === "KeyP" || e.code === "Keyp") togglePause();
        });

        document.addEventListener("touchstart", (e) => {
            if (isGameStarted && e.target !== pauseBtn) jump();
        });

        document.addEventListener("mousedown", (e) => {
            if (isGameStarted && e.target !== pauseBtn && !startScreen.contains(e.target)) jump();
        });

        // 점수 및 성공 판정 루프
        setInterval(() => {
            if (isGameStarted && !isGameOver && !isPaused) {
                score += 1;
                scoreDisplay.innerText = score;

                if (score >= targetDistance) {
                    gameSuccess();
                }
            }
        }, 100);

        // 충돌 및 아이템 획득 감지 루프
        setInterval(() => {
            if (!isGameStarted || isGameOver || isPaused) return;

            const carrierRect = carrier.getBoundingClientRect();
            const obstacleRect = obstacle.getBoundingClientRect();
            const itemRect = item.getBoundingClientRect();

            // 1. 장애물 충돌 감지
            const isCollidingObstacle = !(
                carrierRect.right < obstacleRect.left ||
                carrierRect.left > obstacleRect.right ||
                carrierRect.bottom < obstacleRect.top ||
                carrierRect.top > obstacleRect.bottom
            );

            if (isCollidingObstacle && !isInvincible) {
                hp -= 25;
                if (hp < 0) hp = 0;
                updateHpUI();

                if (hp <= 0) {
                    gameFailed();
                } else {
                    isInvincible = true;
                    carrier.style.opacity = "0.5";
                    setTimeout(() => {
                        isInvincible = false;
                        carrier.style.opacity = "1";
                    }, 500);
                }
            }

            // 2. 지질 아이템 획득 감지
            const isCollidingItem = !(
                carrierRect.right < itemRect.left ||
                carrierRect.left > itemRect.right ||
                carrierRect.bottom < itemRect.top ||
                carrierRect.top > itemRect.bottom
            );

            if (isCollidingItem) {
                if (hp < 100) {
                    hp += 20;
                    if (hp > 100) hp = 100;
                    updateHpUI();
                }
                item.style.display = "none";
                setTimeout(() => { item.style.display = "block"; }, 2000);
            }
        }, 10);

        function updateHpUI() {
            hpDisplay.innerText = hp + "%";
            hpDisplay.style.color = hp <= 30 ? "#ef4444" : "#4ade80";
        }

        function gameFailed() {
            isGameOver = true;
            stopAnimations();
            messageText.innerHTML = "<span style='color:#ef4444;'>세포 내 분해 완료 (실패)</span><br><span style='font-size:14px; color:#fff;'>클릭 시 재시작</span>";
            messageText.style.display = "block";
        }

        function gameSuccess() {
            isGameOver = true;
            stopAnimations();
            messageText.innerHTML = "<span style='color:#4ade80;'>표적 수용체 도달 성공! (클리어)</span><br><span style='font-size:14px; color:#fff;'>클릭 시 재시작</span>";
            messageText.style.display = "block";
        }

        function stopAnimations() {
            obstacle.classList.remove("object-move");
            item.classList.remove("object-move");
        }

        function restartGame() {
            hp = 100;
            score = 0;
            isGameOver = false;
            isPaused = false;
            pauseBtn.innerText = "⏸️ 일시정지";
            updateHpUI();
            scoreDisplay.innerText = "0";
            messageText.style.display = "none";
            obstacle.classList.add("object-move");
            item.classList.add("object-move");
            obstacle.classList.remove("paused");
            item.classList.remove("paused");
            carrier.classList.remove("paused");
        }
    </script>
</body>
</html>
