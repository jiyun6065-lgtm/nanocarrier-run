<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>NanoCarrier Run</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        /* 지질막 나노캐리어 캐릭터 (SVG) */
        .carrier-container {
            width: 100px;
            height: 100px;
            animation: bounce 1s infinite alternate ease-in-out;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>
    <h1>NanoCarrier Run</h1>
    <p>세포막 DDS 투과 시뮬레이터 준비 중...</p>
    
    <!-- 지질 이중층 나노캐리어 캐릭터 -->
    <div class="carrier-container">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- 외곽 지질 이중층 (Lipid Bilayer) -->
            <circle cx="50" cy="50" r="42" fill="none" stroke="#4cc9f0" stroke-width="6" stroke-dasharray="6,3"/>
            <circle cx="50" cy="50" r="35" fill="none" stroke="#4361ee" stroke-width="4"/>
            <!-- 내부 유효 성분 (Core Drug) -->
            <circle cx="50" cy="50" r="22" fill="#7209b7"/>
            <circle cx="45" cy="45" r="6" fill="#f72585"/>
            <circle cx="56" cy="52" r="4" fill="#f72585"/>
            <!-- 통과용 표시 눈망울 -->
            <circle cx="42" cy="48" r="3" fill="#ffffff"/>
            <circle cx="58" cy="48" r="3" fill="#ffffff"/>
        </svg>
    </div>

    <p><small>통신 상태: 정상 (지질막 내구도 100%)</small></p>
</body>
</html>
